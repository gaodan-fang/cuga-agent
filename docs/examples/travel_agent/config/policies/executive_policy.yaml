# Executive Travel Policy
# Premium policy for executives with maximum flexibility

role: executive

flight_policy:
  max_cost_per_person: 1500
  allowed_classes:
    - economy
    - premium_economy
    - business
  preferred_airlines: []
  max_layovers: 1
  direct_flight_preference: true
  
hotel_policy:
  max_rate_per_night: 400
  min_rating: 4.0
  allowed_classes:
    - comfort
    - upscale
    - luxury
  required_amenities:
    - Free Wi-Fi
    - Breakfast included
    - Gym
  preferred_amenities:
    - Business center
    - Concierge
    - Spa
    - Parking
    
expense_policy:
  max_total_budget: 8000
  meal_per_diem: 100
  ground_transport_daily: 100
  incidental_daily: 50
  
approval_policy:
  approval_required: true
  approver_role: approving_manager  # Executive trips require approving manager approval
  auto_approve_under: 5000
  exception_request_allowed: true
  escalation_hours: 48  # Escalate if no response in 48 hours
  
restrictions:
  business_class_allowed: true
  luxury_hotels_allowed: true
  car_rental_class: premium

