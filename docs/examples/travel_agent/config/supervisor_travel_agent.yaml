# Travel Agent Supervisor Configuration
# This file defines the multi-agent supervisor system for corporate travel planning

supervisor:
  model:
    provider: groq
    model_name: openai/gpt-oss-120b
  description: "Supervisor for coordinating travel planning agents with policy compliance and approval workflows"
  
  special_instructions: |
    # Travel Planning Workflow - STRICT EXECUTION
    
    ## Phase 1: Search (Execute ONCE, then STOP)
    ```python
    flights = await delegate_to_flight_agent("Search flights from [origin] to [destination], departure [date], return [date]")
    hotels = await delegate_to_hotel_agent("Search hotels in [destination] from [check-in] to [check-out]")
    ```
    **STOP HERE** - Do not continue to Phase 2 until you have both results.
    
    ## Phase 2: Compliance (Execute ONCE, then STOP and PRESENT)
    ```python
    # Extract JSON from agent responses
    compliance = await delegate_to_compliance_agent("Filter these options for employee role: flights_json=[flights JSON], hotels_json=[hotels JSON]")
    ```
    **CRITICAL**: After getting compliance results, you MUST:
    1. Return the compliance_agent's EXACT response as your final answer
    2. Do NOT summarize, do NOT paraphrase, do NOT skip any tables
    3. Simply output: compliance (the variable containing the full response)
    4. Then STOP and WAIT for user selection
    
    ## Phase 3: Approval (ONLY after user selects)
    When user says something like "I want flight X and hotel Y":
    ```python
    approval = await delegate_to_approval_agent("Process approval: origin=[from user], destination=[from user], departure=[date], return=[date], flight='[selection]', hotel='[selection]', total_cost=$[calculated]")
    ```
    
    **RULES**:
    - Each phase executes ONCE only
    - After Phase 2, your response MUST be the compliance_agent's full output
    - Never skip showing the compliance tables to the user
    - The approval_agent handles user info automatically

agents:

  - name: approval_agent
    type: internal
    description: "Approval workflow specialist who handles manager approval requests via Slack"
    import_from: docs.examples.travel_agent.agents.approval_agent
    special_instructions: "You handle travel approval workflows. Use hardcoded values: user_name='John Doe', user_email='john@company.com'. Extract all other trip details from the supervisor's message. Save to database and send Slack approval request."

  - name: flight_agent
    type: internal
    description: "Flight search specialist who finds and filters flights based on requirements and policies"
    import_from: docs.examples.travel_agent.agents.flight_agent
    special_instructions: "Call search_flights() and return ONLY the raw JSON string from the tool. Do not add any text, explanations, or formatting. Just return the JSON exactly as the tool outputs it."

  - name: hotel_agent
    type: internal
    description: "Hotel search specialist who finds and filters hotels based on requirements and policies"
    import_from: docs.examples.travel_agent.agents.hotel_agent
    special_instructions: "Call search_hotels() and return ONLY the raw JSON string from the tool. Do not add any text, explanations, or formatting. Just return the JSON exactly as the tool outputs it."

  - name: weather_agent
    type: internal
    description: "Weather specialist who provides destination forecasts and packing suggestions"
    import_from: docs.examples.travel_agent.agents.weather_agent
    special_instructions: "You are a weather specialist. Provide forecasts and packing recommendations for travel destinations."

  - name: finance_agent
    type: internal
    description: "Financial specialist who calculates expenses and generates reports"
    import_from: docs.examples.travel_agent.agents.finance_agent
    special_instructions: "You are a financial specialist. Calculate trip costs and validate against budget limits."

  - name: compliance_agent
    type: internal
    description: "Policy enforcement specialist who ensures travel complies with corporate policies"
    import_from: docs.examples.travel_agent.agents.compliance_agent
    special_instructions: |
      You are a policy compliance specialist. Use the analyze_travel_compliance tool to filter options.
      
      Process:
      1. Receive flights_json and hotels_json from the supervisor
      2. Call analyze_travel_compliance(flights_json, hotels_json, role="employee")
      3. The tool will apply role-based policy constraints (Tool Guide injects policy details)
      4. Return the tool's analysis with compliant options and explanations
      
      The Tool Guide system automatically injects policy constraints into the tool's context,
      so you can provide intelligent filtering with detailed explanations.

# Optional: A2A protocol configuration for external agents
a2a:
  protocol_version: "1.0"
  communication:
    type: http
    timeout: 30
    retry_policy:
      max_retries: 3
      backoff: exponential
  message_format:
    schema: json
    validation: strict

